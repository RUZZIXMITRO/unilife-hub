<p>toast works!</p>
<div class="toast-container">
  <div class="toast" *ngFor="let toast of toasts" [class]="'toast toast-' + toast.type">
    <div class="toast-icon">
      <!-- Success -->
      <svg *ngIf="toast.type === 'success'" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="9" fill="#dcfce7"/>
        <path d="M6 10 L9 13 L14 7" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <!-- Error -->
      <svg *ngIf="toast.type === 'error'" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="9" fill="#fee2e2"/>
        <line x1="7" y1="7" x2="13" y2="13" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
        <line x1="13" y1="7" x2="7" y2="13" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <!-- Info -->
      <svg *ngIf="toast.type === 'info'" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="9" fill="#dbeafe"/>
        <line x1="10" y1="9" x2="10" y2="14" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
        <circle cx="10" cy="6.5" r="1" fill="#2563eb"/>
      </svg>
      <!-- Warning -->
      <svg *ngIf="toast.type === 'warning'" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="9" fill="#fef9c3"/>
        <line x1="10" y1="6" x2="10" y2="11" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
        <circle cx="10" cy="14" r="1" fill="#ca8a04"/>
      </svg>
    </div>
    <span class="toast-message">{{ toast.message }}</span>
    <button class="toast-close" (click)="remove(toast.id)">
      <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <line x1="5" y1="5" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="15" y1="5" x2="5" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>
