<div class="topbar">

  <!-- ===== LEFT : Search ===== -->
  <div class="topbar-left">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8" opacity="0.6"/>
        <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </svg>
      <input type="text" placeholder="Rechercher un cours, service..." [(ngModel)]="searchQuery"/>
    </div>
  </div>

  <!-- ===== RIGHT ===== -->
  <div class="topbar-right">

    <!-- Météo + Date -->
    <div class="weather-chip">
      <svg class="wc-ico" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="4" fill="#f59e0b" opacity="0.9"/>
        <line x1="10" y1="1.5" x2="10" y2="3.5"     stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
        <line x1="10" y1="16.5" x2="10" y2="18.5"   stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
        <line x1="1.5" y1="10" x2="3.5" y2="10"     stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
        <line x1="16.5" y1="10" x2="18.5" y2="10"   stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
        <line x1="4"    y1="4"  x2="5.5" y2="5.5"   stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="14.5" y1="14.5" x2="16" y2="16"   stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="16"   y1="4"  x2="14.5" y2="5.5"  stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="5.5"  y1="14.5" x2="4" y2="16"    stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div class="wc-info">
        <span class="wc-temp">24°C</span>
        <span class="wc-date">{{ todayLabel }}</span>
      </div>
    </div>

    <div class="topbar-divider"></div>

    <!-- Dark / Light mode -->
    <button class="icon-btn" (click)="toggleTheme()" [title]="isDarkMode ? 'Mode clair' : 'Mode sombre'">
      <ng-container *ngIf="!isDarkMode">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 3 C6.1 3 3 6.1 3 10 C3 13.9 6.1 17 10 17 C12.4 17 13.9 15.5 14.7 14.2 C11.2 14 8 11 8 7 C8 5.5 8.5 4.1 9.5 3.1 C9.7 3 9.8 3 10 3 Z" fill="currentColor" opacity="0.85"/>
        </svg>
      </ng-container>
      <ng-container *ngIf="isDarkMode">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10" cy="10" r="4" fill="currentColor" opacity="0.9"/>
          <line x1="10" y1="1.5"  x2="10" y2="3.5"   stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
          <line x1="10" y1="16.5" x2="10" y2="18.5"  stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
          <line x1="1.5"  y1="10" x2="3.5"  y2="10"  stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
          <line x1="16.5" y1="10" x2="18.5" y2="10"  stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        </svg>
      </ng-container>
    </button>

    <!-- Messages -->
    <button class="icon-btn msg-btn" (click)="toggleMsgMenu()">
      <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="3" width="16" height="12" rx="4" fill="currentColor" opacity="0.15"/>
        <rect x="2" y="3" width="16" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.8"/>
        <rect x="5" y="7"  width="10" height="1.8" rx="0.9" fill="currentColor" opacity="0.6"/>
        <rect x="5" y="10" width="7"  height="1.8" rx="0.9" fill="currentColor" opacity="0.4"/>
        <path d="M5 15 L7 13 L15 13" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/>
      </svg>
      <span class="icon-badge" *ngIf="unreadMessages > 0">{{ unreadMessages }}</span>

      <!-- Panel Messages -->
      <div class="msg-panel" *ngIf="showMsgMenu" (click)="$event.stopPropagation()">
        <div class="mp-head">
          <span>Messages</span>
          <span class="np-count">{{ unreadMessages }} non lus</span>
        </div>
        <div class="mp-search">
          <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <circle cx="6.5" cy="6.5" r="4" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
            <line x1="9.5" y1="9.5" x2="13" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
          </svg>
          <input type="text" placeholder="Rechercher une conversation..." [(ngModel)]="msgSearch"/>
        </div>
        <div class="mp-list">
          <div class="mp-item unread" (click)="openConversation('imane')">
            <div class="mp-avatar" style="background:linear-gradient(135deg,#8b5cf6,#6d28d9)">I</div>
            <div class="mp-body">
              <div class="mp-top"><p>Imane ZEROUALI</p><span class="mp-time">09:14</span></div>
              <span class="mp-preview">Tu as vu le dernier commit sur GitLab ?</span>
            </div>
            <div class="mp-dot"></div>
          </div>
          <div class="mp-item unread" (click)="openConversation('anas')">
            <div class="mp-avatar" style="background:linear-gradient(135deg,#10b981,#059669)">A</div>
            <div class="mp-body">
              <div class="mp-top"><p>Anas BENABDELAZIZ</p><span class="mp-time">Hier</span></div>
              <span class="mp-preview">La réunion sprint est à 14h 👍</span>
            </div>
            <div class="mp-dot"></div>
          </div>
          <div class="mp-item" (click)="openConversation('abdessamad')">
            <div class="mp-avatar" style="background:linear-gradient(135deg,#f59e0b,#d97706)">A</div>
            <div class="mp-body">
              <div class="mp-top"><p>Abdessamad CHENOUF</p><span class="mp-time">Lun</span></div>
              <span class="mp-preview">OK j'ai poussé les modifs sur develop</span>
            </div>
          </div>
        </div>
        <div class="mp-quick-send">
          <input type="text" placeholder="Message rapide..." [(ngModel)]="quickMessage" (keyup.enter)="sendQuickMessage()"/>
          <button class="mp-send-btn" (click)="sendQuickMessage()">
            <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 9 L16 3 L10 9 L16 15 Z" fill="currentColor" opacity="0.9"/>
            </svg>
          </button>
        </div>
        <button class="np-footer" routerLink="/student/messages">Ouvrir la messagerie →</button>
      </div>
    </button>

    <!-- Notifications -->
    <button class="icon-btn notif-btn" (click)="toggleNotifMenu()">
  <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 2 C7.2 2 5 4.2 5 7 L5 11 L3 13 L3 14 L17 14 L17 13 L15 11 L15 7 C15 4.2 12.8 2 10 2 Z" fill="currentColor" opacity="0.8"/>
    <path d="M8 14 C8 15.1 8.9 16 10 16 C11.1 16 12 15.1 12 14" fill="currentColor" opacity="0.5"/>
  </svg>
  <span class="icon-badge">3</span>
      <div class="notif-panel" *ngIf="showNotifMenu" (click)="$event.stopPropagation()">
        <div class="np-head">
          <span>Notifications</span>
          <span class="np-count">3 nouvelles</span>
        </div>
        <div class="np-item unread">
          <div class="np-ico" style="background:#eff6ff">
            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
              <polygon points="8,3 13,6 8,8 3,6" fill="#2563eb" opacity="0.8"/>
              <rect x="5.5" y="8.5" width="5" height="4" rx="1.5" fill="#2563eb" opacity="0.6"/>
            </svg>
          </div>
          <div class="np-body"><p>Nouveau cours disponible</p><span>Algorithmes avancés · Il y a 5 min</span></div>
          <div class="np-dot"></div>
        </div>
        <div class="np-item unread">
          <div class="np-ico" style="background:#f0fdf4">
            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
              <circle cx="8" cy="6" r="3.5" fill="#16a34a" opacity="0.7"/>
              <path d="M2 14 C2 10.5 14 10.5 14 14" fill="#16a34a" opacity="0.4"/>
            </svg>
          </div>
          <div class="np-body"><p>Nouvelle demande d'ami</p><span>Réseau Social · Il y a 1h</span></div>
          <div class="np-dot"></div>
        </div>
        <div class="np-item unread">
          <div class="np-ico" style="background:#fff7ed">
            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 3 L3.5 3 L5 10 L12 10 L14 5 L4.5 5" stroke="#d97706" stroke-width="1.4" fill="none" stroke-linecap="round"/>
              <circle cx="6.5" cy="12.5" r="1.5" fill="#d97706" opacity="0.8"/>
              <circle cx="11"  cy="12.5" r="1.5" fill="#d97706" opacity="0.8"/>
            </svg>
          </div>
          <div class="np-body"><p>Commande expédiée</p><span>E-Commerce · Hier</span></div>
          <div class="np-dot"></div>
        </div>
        <button class="np-footer">Voir toutes les notifications</button>
      </div>
    </button>

    <div class="topbar-divider"></div>

    <!-- Profile -->
    <div class="profile-dropdown">
      <button class="profile-btn" (click)="toggleProfileMenu()">
        <div class="avatar">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="9" fill="#2563eb"/>
            <circle cx="16" cy="12" r="5" fill="#fff" opacity="0.9"/>
            <path d="M5 28 C5 21 27 21 27 28" fill="#fff" opacity="0.6"/>
          </svg>
        </div>
        <div class="profile-info">
          <span class="profile-name">{{ userName }}</span>
        </div>
        <svg class="dropdown-arrow" viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg"
             [style.transform]="showProfileMenu ? 'rotate(180deg)' : 'rotate(0deg)'">
          <path d="M2 4 L6 8 L10 4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="dropdown-menu" *ngIf="showProfileMenu">
        <div class="dropdown-header">
          <div class="avatar-large">
            <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
              <rect width="40" height="40" rx="11" fill="#2563eb"/>
              <circle cx="20" cy="15" r="6.5" fill="#fff" opacity="0.9"/>
              <path d="M5 36 C5 27 35 27 35 36" fill="#fff" opacity="0.6"/>
            </svg>
          </div>
          <div>
            <p class="dropdown-name">{{ userName }}</p>
            <p class="dropdown-email">{{ userEmail }}</p>
          </div>
        </div>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" (click)="openProfileModal()">
          <svg class="item-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="6.5" r="3.5" fill="currentColor" opacity="0.8"/>
            <path d="M2 16 C2 12 16 12 16 16" fill="currentColor" opacity="0.5"/>
          </svg>
          <span>Mon Profil</span>
        </button>
        <button class="dropdown-item" (click)="openSettingsModal()">
          <svg class="item-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="9" r="2.5" fill="currentColor" opacity="0.85"/>
            <circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.5" stroke-dasharray="3.5 2"/>
          </svg>
          <span>Paramètres</span>
        </button>
        <button class="dropdown-item" (click)="openHelpModal()">
          <svg class="item-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
            <text x="9" y="13" text-anchor="middle" font-size="9" fill="currentColor" font-weight="bold" font-family="sans-serif" opacity="0.85">?</text>
          </svg>
          <span>Aide</span>
        </button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item logout" (click)="logout()">
          <svg class="item-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 3 L3 3 L3 15 L7 15" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <path d="M11 6 L15 9 L11 12" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="6" y1="9" x2="15" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Déconnexion</span>
        </button>
      </div>
    </div>

  </div>
</div>

<!-- Modals -->
<app-profile-modal  *ngIf="showProfileModal"  (closeModal)="closeProfileModal()"  (profileUpdated)="loadUserProfile()"></app-profile-modal>
<app-settings-modal *ngIf="showSettingsModal" (closeModal)="closeSettingsModal()"></app-settings-modal>
<app-help-modal     *ngIf="showHelpModal"     (closeModal)="closeHelpModal()"></app-help-modal>
