<div class="messages-page">

  <div class="messages-layout">

    <!-- ===== SIDEBAR CONVERSATIONS ===== -->
    <div class="conv-sidebar">
      <div class="sidebar-header">
        <h3><i class="fa-solid fa-comments"></i> Messages</h3>
      </div>
      <div class="empty-conv">
        <i class="fa-solid fa-comment-slash" style="font-size:1.5rem;color:#94a3b8;display:block;margin-bottom:0.5rem"></i>
        <p>Sélectionnez un ami<br>pour démarrer</p>
      </div>
    </div>

    <!-- ===== ZONE CHAT ===== -->
    <div class="chat-area">

      <div *ngIf="!selectedUserId" class="no-chat">
        <div class="no-chat-icon">
          <i class="fa-solid fa-comments"></i>
        </div>
        <h3>Vos messages</h3>
        <p>Sélectionnez une conversation pour commencer à discuter</p>
      </div>

      <div *ngIf="selectedUserId" class="chat-window">

        <!-- En-tête -->
        <div class="chat-header">
          <div class="chat-avatar">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="chat-user-info">
            <h4>Étudiant #{{ selectedUserId }}</h4>
            <span class="online-status">
              <i class="fa-solid fa-circle"></i> En ligne
            </span>
          </div>
          <div class="chat-actions">
            <button class="filter-btn">
              <i class="fa-solid fa-phone"></i>
            </button>
            <button class="filter-btn">
              <i class="fa-solid fa-video"></i>
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div class="messages-list">
          <div *ngIf="isLoading" class="loading-msg">
            <i class="fa-solid fa-spinner fa-spin"></i> Chargement...
          </div>

          <div *ngFor="let message of messages"
               class="message-bubble"
               [class.my-message]="isMyMessage(message)"
               [class.other-message]="!isMyMessage(message)">
            <p>{{ message.content }}</p>
            <span class="message-time">
              <i class="fa-regular fa-clock"></i>
              {{ getTimeAgo(message.createdAt) }}
              <i class="fa-solid fa-check-double"
                 *ngIf="isMyMessage(message)"
                 [style.color]="message.isRead ? '#2563eb' : '#94a3b8'">
              </i>
            </span>
          </div>
        </div>

        <!-- Input -->
        <div class="message-input-area">
          <button class="filter-btn attach-btn">
            <i class="fa-solid fa-paperclip"></i>
          </button>
          <input [(ngModel)]="newMessage"
                 (keyup.enter)="sendMessage()"
                 placeholder="Écrire un message..."
                 class="message-input">
          <button (click)="sendMessage()"
                  [disabled]="!newMessage.trim()"
                  class="btn-send">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
