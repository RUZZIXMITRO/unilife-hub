<div class="page">

  <!-- Header -->
  <div class="chat-header">
    <div class="header-left">
      <div class="ai-avatar">
        <i class="fa-solid fa-robot"></i>
        <span class="online-dot"></span>
      </div>
      <div>
        <h2>Assistant Shopping IA</h2>
        <p><i class="fa-solid fa-circle online"></i> En ligne — Propulsé par Groq AI</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-action" (click)="goToCart()" title="Mon panier">
        <i class="fa-solid fa-cart-shopping"></i>
      </button>
      <button class="btn-action" (click)="goToShop()" title="Boutique">
        <i class="fa-solid fa-store"></i>
      </button>
      <button class="btn-action btn-clear" (click)="clearConversation()" title="Nouvelle conversation">
        <i class="fa-solid fa-rotate"></i>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages-wrap">
    <div class="messages-list">

      <div
        class="message-row"
        *ngFor="let msg of messages"
        [class.user-row]="msg.role === 'user'"
        [class.ai-row]="msg.role === 'assistant'"
      >
        <!-- AI Avatar -->
        <div class="msg-avatar" *ngIf="msg.role === 'assistant'">
          <i class="fa-solid fa-robot"></i>
        </div>

        <!-- Bubble -->
        <div class="msg-bubble-wrap">
          <div
            class="msg-bubble"
            [class.user-bubble]="msg.role === 'user'"
            [class.ai-bubble]="msg.role === 'assistant'"
            [innerHTML]="formatMessage(msg.content)"
          ></div>
          <span class="msg-time">{{ msg.timestamp | date:'HH:mm' }}</span>

          <!-- Suggestions -->
          <div class="suggestions" *ngIf="msg.suggestions && msg.suggestions.length > 0 && msg.role === 'assistant'">
            <button
              *ngFor="let suggestion of msg.suggestions"
              class="suggestion-btn"
              (click)="sendMessage(suggestion)"
              [disabled]="loading"
            >
              {{ suggestion }}
            </button>
          </div>
        </div>

        <!-- User Avatar -->
        <div class="msg-avatar user-avatar" *ngIf="msg.role === 'user'">
          <i class="fa-solid fa-user"></i>
        </div>

      </div>

      <!-- Loading indicator -->
      <div class="message-row ai-row" *ngIf="loading">
        <div class="msg-avatar">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div class="msg-bubble ai-bubble typing-bubble">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <div #messagesEnd></div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea
        #messageInput
        placeholder="Posez votre question sur nos produits..."
        [(ngModel)]="inputMessage"
        (keydown)="onKeyDown($event)"
        rows="1"
        [disabled]="loading"
      ></textarea>
      <button
        class="btn-send"
        (click)="sendMessage()"
        [disabled]="!inputMessage.trim() || loading"
      >
        <i class="fa-solid fa-spinner fa-spin" *ngIf="loading"></i>
        <i class="fa-solid fa-paper-plane" *ngIf="!loading"></i>
      </button>
    </div>
    <p class="input-hint">
      <i class="fa-solid fa-circle-info"></i>
      Appuyez sur Entrée pour envoyer — Shift+Entrée pour une nouvelle ligne
    </p>
  </div>

</div>
