<div class="help-page">

  <!-- Header -->
  <div class="page-header">
    <div>
      <h1>Centre d'aide</h1>
      <p class="subtitle">Trouvez des réponses à vos questions</p>
    </div>
  </div>

  <!-- Barre de recherche -->
  <div class="search-section">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="Rechercher une question..."
        class="search-input" />
      <button *ngIf="searchQuery" class="clear-btn" (click)="searchQuery = ''">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <div class="help-layout">

    <!-- Sidebar catégories -->
    <div class="categories">
      <button
        *ngFor="let cat of categories"
        class="cat-btn"
        [class.active]="activeCategory === cat.id"
        (click)="setCategory(cat.id)">
        <i class="fa-solid {{ cat.icon }}"></i>
        {{ cat.label }}
      </button>

      <!-- Contact -->
      <div class="contact-card">
        <i class="fa-solid fa-headset"></i>
        <h4>Besoin d'aide ?</h4>
        <p>Contactez l'équipe technique</p>
        <a href="mailto:admin@unilifehub.com" class="contact-btn">
          Envoyer un email
        </a>
      </div>
    </div>

    <!-- FAQ -->
    <div class="faq-section">
      <div *ngIf="filteredFaqs.length === 0" class="no-results">
        <i class="fa-solid fa-magnifying-glass"></i>
        <p>Aucun résultat pour "{{ searchQuery }}"</p>
      </div>

      <div *ngFor="let faq of filteredFaqs" class="faq-item" [class.expanded]="expandedFaq === faq.id">
        <button class="faq-question" (click)="toggleFaq(faq.id)">
          <span>{{ faq.question }}</span>
          <i class="fa-solid" [class.fa-chevron-down]="expandedFaq !== faq.id" [class.fa-chevron-up]="expandedFaq === faq.id"></i>
        </button>
        <div class="faq-answer" *ngIf="expandedFaq === faq.id">
          <p>{{ faq.answer }}</p>
        </div>
      </div>
    </div>

  </div>
</div>
