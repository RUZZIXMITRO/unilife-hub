<div class="todos-page">

  <div class="page-header">
    <div>
      <h1><i class="fa-regular fa-circle-check"></i> Mes Taches</h1>
      <p class="subtitle">Organisez vos taches et restez productif</p>
    </div>
    <button class="btn-primary" (click)="openCreateForm()" *ngIf="!showForm">
      + Nouvelle tache
    </button>
  </div>

  <div *ngIf="showForm" class="form-card">
    <h3>{{ editingTodoId ? 'Modifier' : 'Creer' }} une tache</h3>
    <div class="form-grid">
      <div class="form-group full-width">
        <label>Titre *</label>
        <input type="text" [(ngModel)]="newTodo.title" />
      </div>
      <div class="form-group full-width">
        <label>Description</label>
        <textarea [(ngModel)]="newTodo.description" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Priorite</label>
        <select [(ngModel)]="newTodo.priority">
          <option *ngFor="let p of priorities" [value]="p">{{ p }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Categorie</label>
        <input type="text" [(ngModel)]="newTodo.category" />
      </div>
      <div class="form-group">
        <label>Date limite</label>
        <input type="date" [(ngModel)]="newTodo.dueDate" />
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" (click)="cancelForm()">Annuler</button>
      <button class="btn-primary" (click)="saveTodo()">{{ editingTodoId ? 'Modifier' : 'Creer' }}</button>
    </div>
  </div>

  <div class="filters">
    <input type="text" [(ngModel)]="searchTerm" placeholder="Rechercher..." class="search" />
    <select [(ngModel)]="sortBy" class="sort">
      <option value="priority">Trier par : Priorite</option>
      <option value="dueDate">Trier par : Date limite</option>
      <option value="category">Trier par : Categorie</option>
    </select>
  </div>

  <div class="tabs">
    <button [class.active]="filter === 'all'" (click)="filter = 'all'">Toutes ({{ totalCount }})</button>
    <button [class.active]="filter === 'pending'" (click)="filter = 'pending'">En cours ({{ pendingCount }})</button>
    <button [class.active]="filter === 'completed'" (click)="filter = 'completed'">Terminees ({{ completedCount }})</button>
    <button [class.active]="filter === 'overdue'" (click)="filter = 'overdue'">En retard ({{ overdueCount }})</button>
  </div>

  <div *ngIf="loading" class="empty">Chargement...</div>
  <div *ngIf="!loading && filteredTodos.length === 0" class="empty">Aucune tache</div>

  <div class="todos-grid">
    <div *ngFor="let todo of filteredTodos" class="todo-card"
         [class.completed]="todo.isCompleted"
         [class.overdue]="todo.isOverdue && !todo.isCompleted">
      <div class="todo-head">
        <input type="checkbox" [checked]="todo.isCompleted" (change)="toggleComplete(todo)" />
        <span class="prio prio-{{ todo.priority.toLowerCase() }}">{{ todo.priority }}</span>
        <div class="actions">
          <button (click)="openEditForm(todo)"><i class="fa-solid fa-pen-to-square"></i></button>
          <button class="del" (click)="deleteTodo(todo)"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
      <h4>{{ todo.title }}</h4>
      <p *ngIf="todo.description">{{ todo.description }}</p>
      <div class="meta">
        <span *ngIf="todo.category"><i class="fa-solid fa-tag"></i> {{ todo.category }}</span>
        <span *ngIf="todo.dueDate"><i class="fa-regular fa-calendar"></i> {{ todo.dueDate | date:'dd/MM/yyyy' }}</span>
        <span *ngIf="todo.isOverdue && !todo.isCompleted" class="overdue-badge"><i class="fa-solid fa-triangle-exclamation"></i> Retard {{ todo.daysOverdue }}j</span>
      </div>
    </div>
  </div>
</div>
