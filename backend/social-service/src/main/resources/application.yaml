server:
  port: 8084

spring:
  application:
    name: social-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost\\SQLEXPRESS:1433;databaseName=social_db;encrypt=false;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:UniLife2026!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

jwt:
  secret: ${JWT_SECRET:SuperSecretKeyForJWTAuthentication2024VeryLongAndComplexKey!@#$%^&*()}
  issuer: UniLifeHub
  audience: UniLifeHubUsers