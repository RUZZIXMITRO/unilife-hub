apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-promotion
  labels:
    app: promotion-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: promotion-service
  template:
    metadata:
      labels:
        app: promotion-service
    spec:
      containers:
        - name: promotion-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8085