apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-order
  labels:
    app: order-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8084"
    spec:
      containers:
        - name: order-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8084
          env:
            - name: ConnectionStrings__DefaultConnection
              value: {{ .Values.env.DB_CONNECTION }}
            - name: Services__CartServiceUrl
              value: {{ .Values.env.CART_URL }}
            - name: Services__InventoryServiceUrl
              value: {{ .Values.env.INVENTORY_URL }}
            - name: Services__PaymentServiceUrl
              value: {{ .Values.env.PAYMENT_URL }}
            - name: Services__CatalogServiceUrl
              value: {{ .Values.env.CATALOG_URL }}
            - name: Services__PromotionServiceUrl
              value: {{ .Values.env.PROMOTION_URL }}