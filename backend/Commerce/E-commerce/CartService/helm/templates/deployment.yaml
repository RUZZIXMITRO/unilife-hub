apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cart
  labels:
    app: cart-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: cart-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8082
          env:
            - name: ConnectionStrings__DefaultConnection
              value: {{ .Values.env.DB_CONNECTION }}
            - name: Redis__ConnectionString
              value: {{ .Values.env.REDIS_CONNECTION }}
            - name: Services__CatalogServiceUrl
              value: {{ .Values.env.CATALOG_URL }}
            - name: Services__InventoryServiceUrl
              value: {{ .Values.env.INVENTORY_URL }}