apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ai
  labels:
    app: ai-assistant
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ai-assistant
  template:
    metadata:
      labels:
        app: ai-assistant
    spec:
      containers:
        - name: ai-assistant
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8090
          env:
            - name: MONGODB_URI
              value: {{ .Values.env.MONGODB_URI }}
            - name: CATALOG_SERVICE_URL
              value: {{ .Values.env.CATALOG_SERVICE_URL }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: anthropic-api-key