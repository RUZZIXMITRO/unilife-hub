server.port=8081
spring.application.name=catalog-service

# MongoDB - pas besoin de creer la DB manuellement !
spring.data.mongodb.uri=mongodb://localhost:27017/catalog_db
spring.data.mongodb.database=catalog_db

# Inter-services
services.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8080}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.unilife=INFO

spring.mvc.cors.allowed-origins=http://localhost:4200
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
