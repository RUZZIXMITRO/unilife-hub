server.port=8084
spring.application.name=review-service

spring.data.mongodb.uri=mongodb://localhost:27017/review_db
spring.data.mongodb.database=review_db

services.order.url=${ORDER_SERVICE_URL:http://localhost:59347}
services.catalog.url=${CATALOG_SERVICE_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,info,prometheus
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.com.unilife=INFO