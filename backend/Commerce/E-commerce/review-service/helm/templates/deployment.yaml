apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-review
  labels:
    app: review-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
        - name: review-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: {{ .Values.env.MONGODB_URI }}