server:
  port: 8081
spring:
  application:
    name: cours-formations-service
  datasource:
    url: jdbc:sqlserver://sqlserver:1433;databaseName=courses_formations_db;encrypt=false;trustServerCertificate=true
    username: sa
    password: UniLife@123!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    serialization:
      fail-on-empty-beans: false
app:
  upload:
    path: uploads/
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html