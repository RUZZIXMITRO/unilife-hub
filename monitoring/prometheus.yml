global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # ── Spring Boot Services ──────────────────────────
  - job_name: 'catalog-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'favorite-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']

  - job_name: 'review-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']

  # ── .NET Services ─────────────────────────────────
  - job_name: 'cart-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:65203']

  - job_name: 'order-service'
    metrics_path: '/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['host.docker.internal:59347']

  - job_name: 'payment-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:52437']

  # ── Python Services ───────────────────────────────
  - job_name: 'ai-assistant-shopping'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8090']

  - job_name: 'ai-assistant-student'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8091']