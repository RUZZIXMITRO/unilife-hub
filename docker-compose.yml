services:
  # ========== SQL SERVER ==========
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: unilifehub-sqlserver
    user: "0:0"  
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=UniLife@2024!Strong
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql/data
      - ./sql-scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - unilifehub-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P UniLife@2024!Strong -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

# ========== MYSQL ==========
  mysql:
    image: mysql:8.0
    container_name: unilifehub-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=marketplace_db
      - MYSQL_USER=yousra
      - MYSQL_PASSWORD=Youssy@123!
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - unilifehub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ========== MARKETPLACE ==========
  marketplace:
    build:
      context: ./backend/Commerce/Marketplace/MarketplaceService
      dockerfile: Dockerfile
    container_name: unilifehub-marketplace
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=prod
      - DATABASE_URL=mysql://yousra:Youssy@123!@mysql:3306/marketplace_db?serverVersion=8.0&charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - unilifehub-network
    restart: unless-stopped

      # ========== API GATEWAY ==========
  apigateway:
    build:
      context: ./backend/ApiGateway
      dockerfile: Dockerfile
    container_name: unilifehub-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - authservice
      - userservice
    networks:
      - unilifehub-network
    restart: unless-stopped

  # ========== AUTHENTICATION SERVICE ==========
  authservice:
    build:
      context: ./backend/AuthenticationService
      dockerfile: Dockerfile
    container_name: unilifehub-auth
    ports:
      - "7076:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=authentication1_db;User Id=sa;Password=UniLife@2024!Strong;TrustServerCertificate=True;Encrypt=False;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - unilifehub-network
    restart: unless-stopped

  # ========== USER SERVICE ==========
  userservice:
    build:
      context: ./backend/UserService
      dockerfile: Dockerfile
    container_name: unilifehub-users
    ports:
      - "7212:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=user_service_db;User Id=sa;Password=UniLife@2024!Strong;TrustServerCertificate=True;Encrypt=False;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - unilifehub-network
    restart: unless-stopped


  # ========== AGENDA TODO SERVICE ==========
  agendaservice:
    build:
      context: ./services/agenda-todo
      dockerfile: Dockerfile
    container_name: unilifehub-agenda-todo
    ports:
      - "5254:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=agenda_todo_db;User Id=sa;Password=UniLife@2024!Strong;TrustServerCertificate=True;Encrypt=False;
      - Jwt__Key=SuperSecretKeyForJWTAuthentication2024VeryLongAndComplexKey!@#$%^&*()
      - Jwt__Issuer=UniLifeHub
      - Jwt__Audience=UniLifeHubUsers
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - unilifehub-network
    restart: unless-stopped
networks:
  unilifehub-network:
    driver: bridge

volumes:
  sqldata:
  mysqldata: