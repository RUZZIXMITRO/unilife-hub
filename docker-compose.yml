version: '3.8'

services:
  # ========== AUTHENTICATION SERVICE ==========
  authservice:
    build:
      context: ./backend/AuthenticationService1
      dockerfile: Dockerfile
    container_name: unilifehub-auth
    ports:
      - "7076:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    networks:
      - unilifehub-network
    restart: unless-stopped

  # ========== USER SERVICE ==========
  userservice:
    build:
      context: ./backend/UserService
      dockerfile: Dockerfile
    container_name: unilifehub-users
    ports:
      - "7212:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    networks:
      - unilifehub-network
    restart: unless-stopped

networks:
  unilifehub-network:
    driver: bridge