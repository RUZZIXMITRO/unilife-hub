services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: unilifehub-sqlserver
    user: "0:0"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=UniLife@2024!Strong
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql/data
      - ./sql-scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - unilifehub-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P UniLife@2024!Strong -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  authservice:
    build:
      context: ./backend/AuthenticationService
      dockerfile: Dockerfile
    container_name: unilifehub-auth
    ports:
      - "7076:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=authentication1_db;User Id=sa;Password=UniLife@2024!Strong;TrustServerCertificate=True;Encrypt=False;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - unilifehub-network
    restart: unless-stopped

  userservice:
    build:
      context: ./backend/UserService
      dockerfile: Dockerfile
    container_name: unilifehub-users
    ports:
      - "7212:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=user_service_db;User Id=sa;Password=UniLife@2024!Strong;TrustServerCertificate=True;Encrypt=False;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - unilifehub-network
    restart: unless-stopped

  cours-formations-service:
    build:
      context: ./backend/cours-formations-service
      dockerfile: Dockerfile
    container_name: unilifehub-cours-formations
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=courses_formations_db;encrypt=false;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=UniLife@2024!Strong
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.microsoft.sqlserver.jdbc.SQLServerDriver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.SQLServerDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    volumes:
      - cours_uploads:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - unilifehub-network
    restart: unless-stopped

networks:
  unilifehub-network:
    driver: bridge

volumes:
  sqldata:
  cours_uploads: