services:
  # ========== SQL SERVER ==========
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: unilifehub-sqlserver
    user: "0:0"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql/data
      - ./sql-scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - unilifehub-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD}" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  # ========== API GATEWAY ==========
  apigateway:
    build:
      context: ./backend/ApiGateway
      dockerfile: Dockerfile
    container_name: unilifehub-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Secret=${JWT_SECRET}
    depends_on:
      - authservice
      - userservice
      - socialservice
    networks:
      - unilifehub-network
    restart: unless-stopped

  # ========== AUTHENTICATION SERVICE ==========
  authservice:
    build:
      context: ./backend/AuthenticationService
      dockerfile: Dockerfile
    container_name: unilifehub-auth
    ports:
      - "7076:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=${AUTH_DB}
      - Jwt__Secret=${JWT_SECRET}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - unilifehub-network
    restart: unless-stopped

  # ========== USER SERVICE ==========
  userservice:
    build:
      context: ./backend/UserService
      dockerfile: Dockerfile
    container_name: unilifehub-users
    ports:
      - "7212:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=${USER_DB}
      - Jwt__Secret=${JWT_SECRET}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - unilifehub-network
    restart: unless-stopped

  # ========== SOCIAL SERVICE ==========
  socialservice:
    build:
      context: ./backend/social-service
      dockerfile: Dockerfile
    container_name: unilifehub-social
    ports:
      - "7084:8084"
    environment:
      - SPRING_DATASOURCE_URL=${SOCIAL_DB}
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=${SA_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - unilifehub-network
    restart: unless-stopped

networks:
  unilifehub-network:
    driver: bridge

volumes:
  sqldata: